name: CI/CD Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push
        run: |
          cd backend
          docker build -t ${{ steps.login-ecr.outputs.registry }}/tienda-backend:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/tienda-backend:latest

      - name: Deploy SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Update Backend" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin '${ECR_REGISTRY}'}",
              "sudo docker pull '${ECR_REGISTRY}'/'${ECR_REPOSITORY}':latest",
              "sudo docker stop tienda-backend || true",
              "sudo docker rm tienda-backend || true",
              "sudo docker run -d --name tienda-backend -p 3001:3001 '${ECR_REGISTRY}'}/'${ECR_REPOSITORY}':latest"
            ]}'